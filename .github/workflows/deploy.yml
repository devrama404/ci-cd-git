name: Deploy

on:
 push:
   branches: [ "main" ]

jobs:
 deploy:
   runs-on: ubuntu-latest

   steps:
     - name: Deploy ke server
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{ secrets.HOST }}
         username: ${{ secrets.USER }}
         key: ${{ secrets.SSH_KEY }}
         script: |
           cd app-ci-cd
           git pull
           npm install
           pm2 restart app

